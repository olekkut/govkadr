[project]
name = "govkadr"
version = "0.1.0"
description = "Local pipeline that turns phone portraits into compliant 35x45 mm Polish ID/passport photos (gov.pl, ICAO 9303), with studio relighting modes and an identity-drift audit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleksander Kutycki" }]
requires-python = ">=3.12,<3.13"
keywords = ["biometric", "passport-photo", "id-photo", "icao", "matting", "relighting", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pillow>=11.0",
    "opencv-contrib-python>=4.10",
    "mediapipe>=0.10.20",
    "onnxruntime>=1.20",
    "pymatting>=1.1.13",
    "torch>=2.9",
    "torchvision>=0.24",
    # BiRefNet ships as Hugging Face remote code written against the 4.x API.
    "transformers>=4.46,<5",
    "timm>=1.0",
    "kornia>=0.7",
    "einops>=0.8",
    "diffusers>=0.37",  # Flux2KleinPipeline / Flux2KleinInpaintPipeline
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
    "psutil>=5.9",
]

[project.urls]
Repository = "https://github.com/olekkut/govkadr"
Issues = "https://github.com/olekkut/govkadr/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
govkadr = "govkadr.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["govkadr"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
